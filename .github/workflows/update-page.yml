name: Publish GitHub Pages

on:
  schedule:
    - cron: "18 */6 * * *"
  repository_dispatch:
    types: [build_and_deploy]
  workflow_dispatch: # 手動でも実行できるようにする

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Inspect files before checkout
        run: ls -la
      - name: show current directory before checkout
        run: pwd
      - uses: actions/checkout@v3
      - name: Inspect files after checkout
        run: ls -la
      - name: show current directory after checkout
        run: pwd
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm Package
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci
      - name: copyfiles
        run: |
          for platform in PC Quest; do
            for i in {0..35}; do
              curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/base_${platform}_${i}.jpg "https://Sewakana.github.io/my-world-discovery-poster/base_${platform}_${i}.jpg" || rm -f work/base_${platform}_${i}.jpg
              curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/base_${platform}_d_${i}.jpg "https://Sewakana.github.io/my-world-discovery-poster/base_${platform}_d_${i}.jpg" || rm -f work/base_${platform}_d_${i}.jpg
            done
          done
          curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/posterInfo.json https://Sewakana.github.io/my-world-discovery-poster/posterInfo.json || rm -f work/posterInfo.json
          # v2 API
          curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/posterData.json https://search.yahoo.co.jp/realtime/api/v1/pagination?p=VRChat_world&md=h&results=30&mtype=image
          find work -type f -empty -delete
      - name: Install multilingual fonts and locales
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji language-pack-ja language-pack-zh-hans language-pack-ko
          sudo locale-gen ja_JP.UTF-8 zh_CN.UTF-8 ko_KR.UTF-8
          sudo update-locale LANG=ja_JP.UTF-8
          echo "LANG=ja_JP.UTF-8" >> $GITHUB_ENV
      - name: start action...
        env:
          BLACKLIST: ${{ vars.BLACKLIST }}
        run: >
          node app.js
      - name: check results
        run: >
          ls -ltr images
      - uses: actions/upload-artifact@v4
        with:
          name: my_site
          path: images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: images

  deploy:
    needs: build
    runs-on: ubuntu-latest 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
